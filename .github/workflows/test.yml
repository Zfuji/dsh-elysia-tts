name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: lint
        run: npm run lint
      - name: 格式检查
        run: npm run format:check
      - name: 语法检查
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: 单元 + 集成测试
        run: npm test
